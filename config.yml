programs:
  nginx:
    cmd: "echo $ANSWER"
    numprocs: 6
    umask: 022
    workingdir: /tmp
    autostart: false
    autorestart: never
    exitcodes:
      - 0
      - 2
    startretries: 2
    starttime: 5
    stopsignal: SIGTERM
    stoptime: 10
    stdout: nginx.stdout
    env:
      STARTED_BY: taskmaster
  vogsphere:
    cmd: "sleep 2"
    numprocs: 1
    umask: 077
    workingdir: /tmp
    autostart: false
    autorestart: unexpected
    exitcodes: 
      - 0
    startretries: 0
    starttime: 3
    stopsignal: USR1
    stoptime: 10
    stdout: /tmp/vgsworker.stdout
    stderr: /tmp/vgsworker.stderr
  test:
    cmd: "touch testfile && ls -l testfile"
    numprocs: 1
    umask: 022
    workingdir: /app
    autostart: true
    autorestart: unexpected
    exitcodes: 
      - 0
    startretries: 0
    starttime: 0
    stopsignal: USR1
    stoptime: 1
    stdout: test.stdout
    stderr: test.stderr

  asd:
    asdasd: